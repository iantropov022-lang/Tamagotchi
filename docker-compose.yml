version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tamagotchi_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tamagotchi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: tamagotchi_web
    environment:
      # ВАЖНО: хост базы данных здесь "db", а не "localhost"!
      # Это имя сервиса в docker-compose
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tamagotchi}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Монтируем папку со статикой, чтобы изменения были видны сразу
      - ./static:/app/static

volumes:
  postgres_data: